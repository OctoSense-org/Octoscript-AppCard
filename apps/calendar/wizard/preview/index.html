<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar preview · one calendar, two devices</title>
<style>
  :root { --ink: #1c1c1e; --muted: #6b7280; --line: #e5e5ea; --accent: #ff3b30; --bg: #eef1f5; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 406px minmax(280px, 420px); gap: 28px; padding: 24px; max-width: 900px; }
  .phone { position: relative; width: 406px; height: 776px; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 10px 40px rgba(20, 30, 50, .18); }
  .phone.desktop { border-radius: 16px; }
  .screen { position: absolute; inset: 0; }
  .s, .t, .i, .c { position: absolute; box-sizing: border-box; }
  .t { white-space: nowrap; overflow: visible; pointer-events: none; }
  .i { pointer-events: none; }
  .c { cursor: pointer; background: transparent; }
  .c:hover { outline: 2px solid rgba(10, 132, 255, .45); outline-offset: -2px; border-radius: 10px; }
  .c.disabled { cursor: not-allowed; outline: none; }
  .c.primary { outline: 2px solid rgba(255, 59, 48, .55); outline-offset: -2px; border-radius: 10px; }
  aside { display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card h1 { font-size: 17px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { font-size: 12px; color: var(--muted); }
  .status b { color: var(--ink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: #c7c7cc; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: #34c759; }
  .dot.off { background: #ff9500; }
  .notice { font-size: 12px; color: #b42318; background: #fef3f2; border: 1px solid #fecdca; border-radius: 8px; padding: 6px 10px; }
  .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f2f2f7; color: var(--muted); }
  @media (max-width: 880px) { .app { grid-template-columns: 1fr; max-width: 460px; } }
</style>
</head>
<body>
<div class="app" data-calendar-preview>
  <div class="phone" data-phone><div class="screen" data-screen></div></div>
  <aside>
    <div class="card">
      <div class="row" style="justify-content: space-between">
        <span class="pill" data-device-label>device</span>
        <span class="row">
          <button data-locale="cn" type="button">中文</button>
          <button data-locale="en" type="button">EN</button>
        </span>
      </div>
      <h1 data-guide-title style="margin-top: 10px">—</h1>
      <p data-guide-text>—</p>
      <div class="row" style="margin-top: 10px">
        <button class="accent" data-next-update type="button" hidden>—</button>
        <button data-back type="button">Back</button>
        <button data-restart type="button">Restart</button>
      </div>
    </div>
    <div class="card">
      <div class="status"><span class="dot" data-conn-dot></span><span data-conn-text>not connected</span></div>
      <div class="status" style="margin-top: 6px">log seq <b data-seq>0</b> · pending <b data-pending>0</b> · frame <b data-frame>1</b></div>
      <div data-notices class="row" style="margin-top: 8px"></div>
    </div>
    <div class="card">
      <p style="margin-bottom: 6px">Activity</p>
      <div class="log" data-log></div>
    </div>
    <div class="card">
      <p>This page renders the storyboard HTML, not the native Makepad cards. The session, sync client and server are the real ones: open a second tab with <code>?device=sam-desktop</code> and watch changes cross over.</p>
    </div>
  </aside>
</div>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
