[package]
name = "personal-data"
version = "0.1.0"
edition = "2021"
description = "octos plugin skill: search Mail and Calendar app data on this device"
authors = ["OctoSense"]
license = "Apache-2.0"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"

[workspace]
