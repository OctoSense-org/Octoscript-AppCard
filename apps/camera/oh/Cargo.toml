[package]
name = "octosense-camera-oh"
version = "0.1.0"
edition = "2021"
description = "The Mate 70 Air camera replica on OpenHarmony native ArkUI widgets (Octoscript-OH), sharing its logic with the Makepad host"

[lib]
name = "camera_oh"
crate-type = ["cdylib"]

[dependencies]
octosense-camera-logic = { path = "../logic" }
octoscript-oh-arkui = { path = "../../../../Octoscript-OH/crates/octoscript-oh-arkui" }
napi-derive-ohos = "0.0.9"
napi-ohos = "0.1.3"
serde_json = "1"

# octoscript-oh-arkui pins the Octoscript VM from git; use the sibling checkout like Octoscript-OH does.
[patch."https://github.com/OctoSense-org/Octoscript.git"]
octoscript-core = { path = "../../../../octoscript/crates/octoscript-core" }
[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../../../../makepad/platform/script" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
