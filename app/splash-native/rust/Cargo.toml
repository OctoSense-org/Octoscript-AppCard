[package]
name = "octos-splash-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Separate platform-native renderer workspace, using the shared runtime VM.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
octoscript-core = { path = "../../../../octoscript/crates/octoscript-core" }
jni = "0.21"
serde_json = "1"
ureq = { version = "2", features = ["tls"] }

[profile.release]
opt-level = 2

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../../../../makepad/platform/script" }
