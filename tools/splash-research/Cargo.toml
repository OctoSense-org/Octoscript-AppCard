[package]
name = "octos-one-splash-research-experiment"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
default-run = "octos-one-splash-research-experiment"

[workspace]

[dependencies]
octoscript-capabilities = { path = "../../../octoscript/crates/octoscript-capabilities" }
octoscript-core = { path = "../../../octoscript/crates/octoscript-core" }
octoscript-schema = { path = "../../../octoscript/crates/octoscript-schema" }
octoscript-ui-l0 = { path = "../../../octoscript/crates/octoscript-ui-l0" }
serde_json = "1.0"
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rss = "2"
scraper = { version = "0.24", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../../../makepad/platform/script" }
